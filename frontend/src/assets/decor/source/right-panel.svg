<svg width="420" height="900" viewBox="0 0 420 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="cloveFill" cx="30%" cy="22%" r="85%">
      <stop offset="0%" stop-color="#f7efdc"/>
      <stop offset="55%" stop-color="#dcc79c"/>
      <stop offset="100%" stop-color="#a3835a"/>
    </radialGradient>
    <radialGradient id="cloveFillShade" cx="30%" cy="22%" r="85%">
      <stop offset="0%" stop-color="#e4cfa4"/>
      <stop offset="55%" stop-color="#c2a877"/>
      <stop offset="100%" stop-color="#8a6c46"/>
    </radialGradient>
    <radialGradient id="tomato" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e8836b"/>
      <stop offset="55%" stop-color="#c1503a"/>
      <stop offset="100%" stop-color="#7a2a1e"/>
    </radialGradient>
    <linearGradient id="rosemary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6f8f5e"/>
      <stop offset="100%" stop-color="#33452a"/>
    </linearGradient>
    <linearGradient id="marbleR" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1224" stop-opacity="0"/>
      <stop offset="100%" stop-color="#05070d" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="softBlurR" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="65"/>
    </filter>
    <filter id="mediumBlurR" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- shallow-depth-of-field ambient bokeh: flat-fill circles pushed
       through a large blur radius, not a radial gradient (gradient
       stops band visibly once blurred at this scale). -->
  <g filter="url(#softBlurR)">
    <circle cx="330" cy="160" r="115" fill="#5a1f18" opacity="0.42"/>
    <circle cx="120" cy="440" r="125" fill="#3a2f14" opacity="0.45"/>
    <circle cx="300" cy="710" r="110" fill="#5a1f18" opacity="0.42"/>
  </g>

  <!-- garlic bulb: a fan of individual clove shapes around a shared
       base, each with its own light/shade fill so the form actually
       reads as garlic rather than a single smooth egg. -->
  <g transform="translate(150,60)">
    <g stroke="#8a6c46" stroke-width="1" opacity="0.5">
      <path d="M75 150 C 20 148 -6 110 6 70 C 16 36 46 8 75 10" fill="url(#cloveFillShade)"/>
      <path d="M75 150 C 130 148 156 110 144 70 C 134 36 104 8 75 10" fill="url(#cloveFill)"/>
      <path d="M75 148 C 44 146 26 116 32 82 C 38 50 58 22 75 18" fill="url(#cloveFillShade)" opacity="0.85"/>
      <path d="M75 148 C 106 146 124 116 118 82 C 112 50 92 22 75 18" fill="url(#cloveFill)" opacity="0.9"/>
      <path d="M75 146 C 58 142 48 118 52 92 C 56 66 66 38 75 26" fill="url(#cloveFill)"/>
    </g>
    <path d="M75 26 L 75 0" stroke="#a9895a" stroke-width="4" stroke-linecap="round"/>
    <path d="M60 8 Q 75 -10 92 6" stroke="#7a5f3d" stroke-width="2" fill="none" opacity="0.6"/>
  </g>

  <!-- cherry tomatoes cluster -->
  <g transform="translate(230,380)">
    <circle cx="0" cy="0" r="46" fill="url(#tomato)"/>
    <ellipse cx="-14" cy="-16" rx="10" ry="6" fill="#f2ab97" opacity="0.55"/>
    <path d="M0 -46 q 6 -14 18 -14" stroke="#4f7a3f" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="70" cy="46" r="30" fill="url(#tomato)"/>
    <ellipse cx="60" cy="34" rx="7" ry="4.5" fill="#f2ab97" opacity="0.5"/>
  </g>

  <!-- rosemary sprig -->
  <g transform="translate(80,560) rotate(12)" opacity="0.92" filter="url(#mediumBlurR)">
    <path d="M0 0 C 10 120 -6 260 4 420" stroke="#33452a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <g stroke="url(#rosemary)" stroke-width="2" stroke-linecap="round">
      <line x1="2" y1="30" x2="-22" y2="20"/>
      <line x1="2" y1="30" x2="26" y2="20"/>
      <line x1="0" y1="70" x2="-24" y2="62"/>
      <line x1="0" y1="70" x2="24" y2="62"/>
      <line x1="1" y1="110" x2="-22" y2="104"/>
      <line x1="1" y1="110" x2="25" y2="102"/>
      <line x1="2" y1="150" x2="-20" y2="146"/>
      <line x1="2" y1="150" x2="23" y2="142"/>
      <line x1="3" y1="190" x2="-20" y2="188"/>
      <line x1="3" y1="190" x2="22" y2="184"/>
      <line x1="4" y1="230" x2="-18" y2="230"/>
      <line x1="4" y1="230" x2="21" y2="224"/>
    </g>
  </g>

  <!-- scattered spice flecks -->
  <g fill="#8a5a2a" opacity="0.8">
    <circle cx="330" cy="560" r="3"/>
    <circle cx="345" cy="575" r="2.4"/>
    <circle cx="318" cy="580" r="2.8"/>
    <circle cx="352" cy="555" r="2"/>
  </g>

  <rect x="0" y="740" width="420" height="160" fill="url(#marbleR)"/>
</svg>
