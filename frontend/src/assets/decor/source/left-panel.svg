<svg width="420" height="900" viewBox="0 0 420 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5c7a4a"/>
      <stop offset="55%" stop-color="#3b5636"/>
      <stop offset="100%" stop-color="#22301f"/>
    </linearGradient>
    <linearGradient id="leafRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d3b06c" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#d3b06c" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lemonFlesh" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f3e3a3"/>
      <stop offset="55%" stop-color="#e2c463"/>
      <stop offset="100%" stop-color="#b98f2e"/>
    </radialGradient>
    <linearGradient id="lemonRind" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d9b654"/>
      <stop offset="100%" stop-color="#8f6a1e"/>
    </linearGradient>
    <radialGradient id="peppercorn" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#5a4632"/>
      <stop offset="100%" stop-color="#241a10"/>
    </radialGradient>
    <linearGradient id="marble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1224" stop-opacity="0"/>
      <stop offset="100%" stop-color="#05070d" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="softBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="65"/>
    </filter>
    <filter id="mediumBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- shallow-depth-of-field ambient bokeh: flat-fill circles pushed
       through a large blur radius (not a radial gradient) -- gradient
       stops band visibly once blurred at this scale, a solid fill
       does not. -->
  <g filter="url(#softBlur)">
    <circle cx="90" cy="150" r="110" fill="#3a2f14" opacity="0.5"/>
    <circle cx="300" cy="420" r="130" fill="#173322" opacity="0.45"/>
    <circle cx="120" cy="700" r="115" fill="#3a2f14" opacity="0.5"/>
  </g>

  <!-- basil sprig, mid-ground, gently softened -->
  <g filter="url(#mediumBlur)" opacity="0.92" transform="translate(60,120) rotate(-8)">
    <path d="M40 0 C 34 140 46 300 40 460" stroke="#22301f" stroke-width="3" fill="none" stroke-linecap="round"/>
    <g>
      <path d="M40 60 Q 0 40 -30 70 Q 0 95 40 96 Z" fill="url(#leaf)"/>
      <path d="M40 60 Q 0 40 -30 70 Q 0 95 40 96 Z" fill="url(#leafRim)"/>
      <path d="M40 130 Q 95 108 118 140 Q 92 168 40 166 Z" fill="url(#leaf)"/>
      <path d="M40 200 Q -8 182 -36 216 Q -6 244 40 236 Z" fill="url(#leaf)"/>
      <path d="M40 270 Q 100 250 126 285 Q 98 312 40 306 Z" fill="url(#leaf)"/>
      <path d="M40 340 Q -10 322 -40 358 Q -8 386 40 376 Z" fill="url(#leaf)"/>
      <path d="M40 410 Q 94 392 116 424 Q 90 450 40 444 Z" fill="url(#leaf)"/>
    </g>
  </g>

  <!-- lemon half, foreground focal element -->
  <g transform="translate(70,560)">
    <circle cx="90" cy="90" r="92" fill="url(#lemonRind)"/>
    <circle cx="90" cy="90" r="76" fill="url(#lemonFlesh)"/>
    <g stroke="#f7ecc2" stroke-width="1.4" opacity="0.65">
      <line x1="90" y1="90" x2="90" y2="16"/>
      <line x1="90" y1="90" x2="153" y2="52"/>
      <line x1="90" y1="90" x2="160" y2="118"/>
      <line x1="90" y1="90" x2="122" y2="172"/>
      <line x1="90" y1="90" x2="52" y2="170"/>
      <line x1="90" y1="90" x2="20" y2="112"/>
      <line x1="90" y1="90" x2="26" y2="46"/>
    </g>
    <circle cx="90" cy="90" r="14" fill="#f7ecc2" opacity="0.5"/>
    <path d="M18 40 A 92 92 0 0 1 60 4" stroke="#e8cf83" stroke-width="4" fill="none" opacity="0.45" stroke-linecap="round"/>
  </g>

  <!-- scattered peppercorns -->
  <g>
    <circle cx="230" cy="640" r="7" fill="url(#peppercorn)"/>
    <circle cx="252" cy="662" r="5.5" fill="url(#peppercorn)"/>
    <circle cx="212" cy="668" r="6" fill="url(#peppercorn)"/>
    <circle cx="268" cy="636" r="4.5" fill="url(#peppercorn)"/>
  </g>

  <!-- countertop shadow, grounds the composition into the page edge -->
  <rect x="0" y="740" width="420" height="160" fill="url(#marble)"/>
</svg>
