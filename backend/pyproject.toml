[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pantrypilot-backend"
version = "0.1.0"
description = "PantryPilot FastAPI backend and deterministic core"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "pydantic-settings>=2.6,<3",
    "uvicorn[standard]>=0.30,<1",
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.27,<1",
    # Module D (M03 Agent Orchestrator): the approved runtime LLMProvider
    # adapter (app.integrations.llm_provider.AnthropicLLMProvider) is
    # built against this SDK. It is imported lazily, only when actually
    # constructing a live client (never at module import time and never
    # on the fake-client test path), so its absence never breaks unit
    # tests -- see app/integrations/llm_provider.py.
    "anthropic>=0.40,<1",
    # Module F 4.3: in-memory rate limiting (app.rate_limit). Genuinely
    # imported at runtime (app.main wires its exception handler), so it
    # belongs in the main dependency list for the same reason noted
    # above -- CI's plain `pip install .` must have it available.
    "slowapi>=0.1.9,<1",
]

[project.optional-dependencies]
# Dev/CI-only tooling, never imported by application code. Not
# installed by CI's current `pip install .` step -- a Module F CI job
# that runs pip-audit needs `pip install '.[dev]'` (or `pip install
# pip-audit` directly) as a separate step.
dev = [
    "pip-audit>=2.7,<3",
]

# NOTE: test tooling (pytest, httpx) is intentionally kept in the main
# dependency list rather than an optional "dev" extra. .github/workflows/ci.yml
# installs this package with a plain `pip install .` (no extras) and then
# runs pytest directly, so an extras-only test dependency would silently
# break CI. This mirrors the constraint rather than editing shared CI config.

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
